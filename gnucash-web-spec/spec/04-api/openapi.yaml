openapi: 3.1.0
info:
  title: GnuCash Web Spec API
  version: 0.3.7
  description: >-
    API contract for Book, Commodity, Account, Invoice, and Transaction/Split posting endpoints.
servers:
  - url: https://api.example.com
    description: Example server

tags:
  - name: Books
  - name: Commodities
  - name: Accounts
  - name: Invoices
  - name: Bills
  - name: Transactions

paths:
  /books:
    post:
      tags: [Books]
      summary: Create book
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BookCreate'
      responses:
        '201':
          description: Book created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Book'
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          $ref: '#/components/responses/Conflict'
    get:
      tags: [Books]
      summary: List books
      responses:
        '200':
          description: Book list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Book'

  /books/{book_id}:
    parameters:
      - $ref: '#/components/parameters/BookId'
    get:
      tags: [Books]
      summary: Get book by id
      responses:
        '200':
          description: Book
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Book'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      tags: [Books]
      summary: Update book
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BookPatch'
      responses:
        '200':
          description: Updated book
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Book'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      tags: [Books]
      summary: Delete book
      description: MUST fail with 409 when book still has accounts.
      responses:
        '204':
          description: Book deleted
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'

  /books/active:
    get:
      tags: [Books]
      summary: Get active book
      responses:
        '200':
          description: Active book
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Book'
        '404':
          $ref: '#/components/responses/NotFound'

  /commodities:
    post:
      tags: [Commodities]
      summary: Create commodity
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CommodityCreate'
      responses:
        '201':
          description: Commodity created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Commodity'
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          $ref: '#/components/responses/Conflict'
    get:
      tags: [Commodities]
      summary: List commodities
      parameters:
        - in: query
          name: namespace
          required: false
          schema:
            type: string
            maxLength: 32
      responses:
        '200':
          description: Commodity list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Commodity'

  /commodities/{commodity_id}:
    parameters:
      - $ref: '#/components/parameters/CommodityId'
    get:
      tags: [Commodities]
      summary: Get commodity by id
      responses:
        '200':
          description: Commodity
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Commodity'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      tags: [Commodities]
      summary: Update commodity
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CommodityPatch'
      responses:
        '200':
          description: Updated commodity
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Commodity'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
    delete:
      tags: [Commodities]
      summary: Delete commodity
      description: MUST fail with 409 when commodity is referenced by any account.
      responses:
        '204':
          description: Commodity deleted
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'

  /accounts:
    post:
      tags: [Accounts]
      summary: Create account
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AccountCreate'
      responses:
        '201':
          description: Account created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Account'
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          $ref: '#/components/responses/Conflict'
    get:
      tags: [Accounts]
      summary: List accounts by book
      parameters:
        - in: query
          name: book_id
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Account list for the provided book
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Account'
        '400':
          $ref: '#/components/responses/BadRequest'

  /accounts/{account_id}:
    parameters:
      - $ref: '#/components/parameters/AccountId'
    get:
      tags: [Accounts]
      summary: Get account by id
      responses:
        '200':
          description: Account
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Account'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      tags: [Accounts]
      summary: Update account
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AccountPatch'
      responses:
        '200':
          description: Updated account
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Account'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
    delete:
      tags: [Accounts]
      summary: Delete account
      description: >-
        MUST fail with 409 when account has children.
        Future constraint: implementations MAY also block delete when referenced by future posting entities.
      responses:
        '204':
          description: Account deleted
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'

  /accounts/tree:
    get:
      tags: [Accounts]
      summary: Get account tree by book
      description: >-
        Returns hierarchical tree sorted by account name at each level.
        Each node includes account code and exact current balance for that account.
      parameters:
        - in: query
          name: book_id
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Root nodes for the account hierarchy
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AccountTreeNode'
        '400':
          $ref: '#/components/responses/BadRequest'

  /invoices:
    post:
      tags: [Invoices]
      summary: Create invoice
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InvoiceCreate'
      responses:
        '201':
          description: Invoice created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Invoice'
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          $ref: '#/components/responses/Conflict'
    get:
      tags: [Invoices]
      summary: List invoices by book
      parameters:
        - in: query
          name: book_id
          required: true
          schema:
            type: string
            format: uuid
        - in: query
          name: customer_guid
          required: false
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Invoice list for the provided book
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Invoice'
        '400':
          $ref: '#/components/responses/BadRequest'

  /invoices/{invoice_guid}:
    parameters:
      - $ref: '#/components/parameters/InvoiceGuid'
    get:
      tags: [Invoices]
      summary: Get invoice by guid
      responses:
        '200':
          description: Invoice
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Invoice'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      tags: [Invoices]
      summary: Update invoice header
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InvoicePatch'
      responses:
        '200':
          description: Updated invoice
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Invoice'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
    delete:
      tags: [Invoices]
      summary: Delete invoice
      responses:
        '204':
          description: Invoice deleted
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'

  /invoices/{invoice_guid}/post:
    parameters:
      - $ref: '#/components/parameters/InvoiceGuid'
    post:
      tags: [Invoices]
      summary: Post invoice into accounting transactions
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InvoicePostRequest'
      responses:
        '200':
          description: Posted invoice
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Invoice'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'

  /invoices/{invoice_guid}/unpost:
    parameters:
      - $ref: '#/components/parameters/InvoiceGuid'
    post:
      tags: [Invoices]
      summary: Undo invoice posting
      responses:
        '200':
          description: Unposted invoice
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Invoice'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'

  /invoices/{invoice_guid}/payments:
    parameters:
      - $ref: '#/components/parameters/InvoiceGuid'
    post:
      tags: [Invoices]
      summary: Register invoice payment
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InvoicePaymentCreate'
      responses:
        '200':
          description: Updated invoice after payment registration
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Invoice'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'

  /invoices/{invoice_guid}/payments/{payment_tx_guid}/undo:
    parameters:
      - $ref: '#/components/parameters/InvoiceGuid'
      - $ref: '#/components/parameters/PaymentTransactionGuid'
    post:
      tags: [Invoices]
      summary: Undo invoice payment
      responses:
        '200':
          description: Updated invoice after payment undo
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Invoice'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'

  /invoices/{invoice_guid}/entries:
    parameters:
      - $ref: '#/components/parameters/InvoiceGuid'
    post:
      tags: [Invoices]
      summary: Create invoice entry
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InvoiceEntryCreate'
      responses:
        '201':
          description: Invoice entry created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InvoiceEntry'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'

  /invoices/{invoice_guid}/entries/{entry_guid}:
    parameters:
      - $ref: '#/components/parameters/InvoiceGuid'
      - $ref: '#/components/parameters/EntryGuid'
    patch:
      tags: [Invoices]
      summary: Update invoice entry
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InvoiceEntryPatch'
      responses:
        '200':
          description: Updated invoice entry
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InvoiceEntry'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
    delete:
      tags: [Invoices]
      summary: Delete invoice entry
      responses:
        '204':
          description: Invoice entry deleted
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'

  /bills:
    post:
      tags: [Bills]
      summary: Create bill
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BillCreate'
      responses:
        '201':
          description: Bill created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Bill'
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          $ref: '#/components/responses/Conflict'
    get:
      tags: [Bills]
      summary: List bills by book
      parameters:
        - in: query
          name: book_id
          required: true
          schema:
            type: string
            format: uuid
        - in: query
          name: vendor_guid
          required: false
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Bill list for the provided book
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Bill'
        '400':
          $ref: '#/components/responses/BadRequest'

  /bills/{bill_guid}:
    parameters:
      - $ref: '#/components/parameters/BillGuid'
    get:
      tags: [Bills]
      summary: Get bill by guid
      responses:
        '200':
          description: Bill
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Bill'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      tags: [Bills]
      summary: Update bill header
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BillPatch'
      responses:
        '200':
          description: Updated bill
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Bill'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
    delete:
      tags: [Bills]
      summary: Delete bill
      responses:
        '204':
          description: Bill deleted
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'

  /bills/{bill_guid}/post:
    parameters:
      - $ref: '#/components/parameters/BillGuid'
    post:
      tags: [Bills]
      summary: Post bill into accounting transactions
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BillPostRequest'
      responses:
        '200':
          description: Posted bill
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Bill'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'

  /bills/{bill_guid}/unpost:
    parameters:
      - $ref: '#/components/parameters/BillGuid'
    post:
      tags: [Bills]
      summary: Undo bill posting
      responses:
        '200':
          description: Unposted bill
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Bill'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'

  /bills/{bill_guid}/payments:
    parameters:
      - $ref: '#/components/parameters/BillGuid'
    post:
      tags: [Bills]
      summary: Register bill payment
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InvoicePaymentCreate'
      responses:
        '200':
          description: Updated bill after payment registration
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Bill'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'

  /bills/{bill_guid}/payments/{payment_tx_guid}/undo:
    parameters:
      - $ref: '#/components/parameters/BillGuid'
      - $ref: '#/components/parameters/PaymentTransactionGuid'
    post:
      tags: [Bills]
      summary: Undo bill payment
      responses:
        '200':
          description: Updated bill after payment undo
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Bill'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'

  /bills/{bill_guid}/entries:
    parameters:
      - $ref: '#/components/parameters/BillGuid'
    post:
      tags: [Bills]
      summary: Create bill entry
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InvoiceEntryCreate'
      responses:
        '201':
          description: Bill entry created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InvoiceEntry'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'

  /bills/{bill_guid}/entries/{entry_guid}:
    parameters:
      - $ref: '#/components/parameters/BillGuid'
      - $ref: '#/components/parameters/EntryGuid'
    patch:
      tags: [Bills]
      summary: Update bill entry
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InvoiceEntryPatch'
      responses:
        '200':
          description: Updated bill entry
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InvoiceEntry'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
    delete:
      tags: [Bills]
      summary: Delete bill entry
      responses:
        '204':
          description: Bill entry deleted
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'

  /transactions:
    post:
      tags: [Transactions]
      summary: Create transaction with splits
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TransactionCreate'
      responses:
        '201':
          description: Transaction created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Transaction'
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          $ref: '#/components/responses/Conflict'
    get:
      tags: [Transactions]
      summary: List transactions by book
      parameters:
        - in: query
          name: book_id
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Transaction list for the provided book
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Transaction'
        '400':
          $ref: '#/components/responses/BadRequest'

  /transactions/{tx_guid}:
    parameters:
      - $ref: '#/components/parameters/TransactionGuid'
    get:
      tags: [Transactions]
      summary: Get transaction by guid
      responses:
        '200':
          description: Transaction
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Transaction'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      tags: [Transactions]
      summary: Update transaction
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TransactionPatch'
      responses:
        '200':
          description: Updated transaction
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Transaction'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
    delete:
      tags: [Transactions]
      summary: Delete transaction
      responses:
        '204':
          description: Transaction deleted
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'

components:
  parameters:
    BookId:
      in: path
      name: book_id
      required: true
      schema:
        type: string
        format: uuid
    CommodityId:
      in: path
      name: commodity_id
      required: true
      schema:
        type: string
        format: uuid
    AccountId:
      in: path
      name: account_id
      required: true
      schema:
        type: string
        format: uuid
    TransactionGuid:
      in: path
      name: tx_guid
      required: true
      schema:
        type: string
        format: uuid
    InvoiceGuid:
      in: path
      name: invoice_guid
      required: true
      schema:
        type: string
        format: uuid
    BillGuid:
      in: path
      name: bill_guid
      required: true
      schema:
        type: string
        format: uuid
    EntryGuid:
      in: path
      name: entry_guid
      required: true
      schema:
        type: string
        format: uuid
    PaymentTransactionGuid:
      in: path
      name: payment_tx_guid
      required: true
      schema:
        type: string
        format: uuid

  responses:
    BadRequest:
      description: Request violates validation or invariant rules.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            invalid_parent:
              value:
                code: INVALID_PARENT
                message: parent_id must reference an account in the same book
                details:
                  field: parent_id
    Conflict:
      description: Resource conflicts with domain integrity constraints.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            has_children:
              value:
                code: ACCOUNT_HAS_CHILDREN
                message: account cannot be deleted while children exist
                details:
                  account_id: 2dfd7a53-8899-4dfa-8b14-1749d5cb84d1
    NotFound:
      description: Resource not found.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            not_found:
              value:
                code: NOT_FOUND
                message: requested resource was not found
                details: {}

  schemas:
    ErrorResponse:
      type: object
      additionalProperties: false
      required: [code, message, details]
      properties:
        code:
          type: string
        message:
          type: string
        details:
          type: object
          additionalProperties: true

    BookCreate:
      type: object
      additionalProperties: false
