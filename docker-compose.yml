version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    container_name: gnucash-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-gnucash}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-gnucash}
      POSTGRES_DB: ${POSTGRES_DB:-gnucash_web}
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-gnucash} -d ${POSTGRES_DB:-gnucash_web}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - gnucash-net

volumes:
  pgdata:

networks:
  gnucash-net:
    driver: bridge
