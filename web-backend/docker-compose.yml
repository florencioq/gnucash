services:
  db:
    image: postgres:16
    container_name: gnucash_web_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-gnucash}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-gnucash}
      POSTGRES_DB: ${POSTGRES_DB:-gnucash_web}
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data-gnucash
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-gnucash} -d ${POSTGRES_DB:-gnucash_web}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
